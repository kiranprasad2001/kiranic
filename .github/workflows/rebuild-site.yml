name: Daily Site Rebuild

on:
  schedule:
    # Run every day at 11:00 UTC (6:00 AM EST) to pick up new GitHub repos
    - cron: '0 11 * * *'
  repository_dispatch:
    # Allows other repos to trigger a rebuild via GitHub API:
    # curl -X POST -H "Authorization: token $GITHUB_PAT" \
    #   -H "Accept: application/vnd.github.v3+json" \
    #   https://api.github.com/repos/kiranprasad2001/kiranic/dispatches \
    #   -d '{"event_type": "rebuild"}'
    types: [rebuild]
  workflow_dispatch: # Manual trigger from GitHub Actions UI

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Site
        env:
          GITHUB_PAT: ${{ secrets.GH_PAT }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy dist --project-name=kiranic
